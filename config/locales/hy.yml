      wapc: WCA Բողոքարկման Կոմիտե
    groups_description:
      wat: 'WCA Արխիվացման Թիմը (անգլերեն՝ WCA Archive Team, կրճատ՝ WAT) կառավարում
        է WCA-ի պատմական արխիվի մշակումն ու պահպանումը: Նրանք փաստաթղթավորում են սփիդքյուբինգի
        հիմնական իրադարձությունները և WCA-ի նշանակալի նվաճումները, որոնք ներկայացվում
        են որպես WCA-ի ավելի լայն ժամանակացույցի մաս՝ սփիդքյուբինգի ոլորտում WCA-ի
        ժառանգությունը պահպանելու համար:'
      wct: 'WCA Հանրային Կապերի Թիմը (անգլերեն՝ WCA Communication Team, կրճատ՝ WCT)
        վերահսկում և աջակցում է WCA-ի հաղորդակցությունը համայնքի և լայն հանրության
        հետ: WCA-ի հաղորդակցությունը պետք է նպաստի WCA-ի նպատակներին և աջակցի բարյացակամության,
        թափանցիկության, ներառականության, բացության և արձագանքողականության ընդհանուր
        դրական մշակույթին:'
      wcat: 'WCA Առաջնությունների Հայտարարման Թիմը (անգլերեն՝ WCA Competition Announcement
        Team, կրճատ՝ WCAT) հաստատում և հայտարարում է WCA պատվիրակների կողմից ներկայացված
        WCA մրցույթները և ապահովում է, որ այդ հայտարարությունները համապատասխանեն WCA
        որակի չափանիշներին: Այս թիմը նաև պատասխանատու է մրցույթների ներկայացման պատշաճ
        արձանագրության պահպանման համար՝ հիմնվելով այնպիսի փաստաթղթերի վրա, ինչպիսիք
        են WCA մրցույթների պահանջների քաղաքականությունը (անգլերեն՝ WCA Competition
        Requirements Policy): WCAT-ը պատասխանատու չէ անհատական մրցույթների կազմակերպման
        և պատվիրակման համար:'
      wic: 'WCA-ի Ինտեգրման Կոմիտեն (անգլերեն՝ WCA Integrity Committee, կրճատ՝ WIC)
        անկախ հետաքննություններ է անցկացնում WCA համայնքի անդամների և WCA մրցումների
        ժամանակ կամ WCA-ի պաշտոնական, առցանց հարթակներում տեղի ունեցած միջադեպերի
        վերաբերյալ: Այս միջադեպերը WCA-ի արժեքների, վարքագծի կանոնագրքի, էթիկայի կանոնագրքի
        և/կամ կանոնակարգերի ենթադրյալ խախտումներ են:'
