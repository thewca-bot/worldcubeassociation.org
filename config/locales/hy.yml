        ու տեսակը։ Խնդրում ենք հեռացրեք այն սարքավորումների անունները որոնք չեք 
        օգտագործել։
      summary: 'Թվարկած կետերը միայն ուղեցույց են ամբողջական զեկույց կազմելու համար:
