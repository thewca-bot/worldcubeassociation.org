      private_description: 'Միջադեպի նկարագրություն, որը կարող են դիտել միայն Պատվիրակները:
        Խնդրում ենք լրացնել այն անգլերենով:'
      private_wrc_decision: WRC-ի վերջնական որոշումը, ներառյալ անձնական 
