        անդամ, ապա պատվիրակների զեկույցները ստանում եք ի սկզբանե։ Նշում՝ 
        փոփոխությունը ուժի մեջ մտնելու համար կարող է պահանջվել մինչև 12 ժամ։
      delegate_reports_region: 'Եթե ցանկանում եք ստանալ բոլոր զեկույցները, այս դաշտը
        թողեք դատարկ (ցանկում վերևի տարբերակը): Նշում՝ փոփոխությունը ուժի մեջ մտնելու
        համար կարող է պահանջվել մինչև 12 ժամ։'
      otp_attempt: Ստուգեք միանգամյա գաղտնաբառի առկայությունը կարգավորված 
        բջջային հավելվածում կամ մուտքագրեք ձեր վերականգնման կոդերից մեկը։
    dob_contact:
      dob: Ձեր ծննդյան ճիշտ օրը ՏԱՐԻ-ԱՄ-ՕՐ ֆորմատով
      document: 'Ձեր ինքնությունը և ծննդյան ճիշտ ամսաթիվը մեզ ապացուցելու համար դուք
        պետք է կցեք ցանկացած իրավական փաստաթղթի լուսանկար (անձնագիր, վարորդական իրավունք,
        ուսանողական քարտ, անձնագիր, ծննդյան վկայական և այլն), որտեղ ձեր անունն ու
        ծննդյան ամսաթիվը տեսանելի և հասկանալի են անգլերեն խոսողի համար (կամ կապվեք
        ձեր տեղական WCA պատվիրակի հետ, եթե նման փաստաթուղթ չունեք): Անձնագրում մեզ
        անհրաժեշտ է առնվազն ձեր անունն ու ծննդյան ամսաթիվը. կարող եք թաքցնել/մաքրել
        անձը հաստատող փաստաթղթում նշված ցանկացած այլ անձնական տվյալ:'
    post:
      body: 'Օգտագործեք &lt;!-- break --&gt; թեգը՝ գլխավոր էջում նախադիտումը ցուցադրելու
        համար: Գլխավոր էջի ցանկացած գրառում կցուցադրի այս բաժանարարից առաջ գտնվող
        ամբողջ տեքստը: Իրական գրառումը կցուցադրի ամբողջ տեքստը:'
      show_on_homepage: Զգույշ եղեք։ Սա անվտանգ չէ անձնական տվյալների համար։ Սա 
        միայն գլխավոր էջի ավելորդ պարունակությունը կանխելու համար է։ Գլխավոր 
        էջում չցուցադրվող գրառումները դեռևս հասանելի են հանրությանը մշտական 
        հղման կամ թեգերի միջոցով։
    delegate_report:
      schedule_url: Ամբողջական հղումը հրապարակված օրակարգի համար (օրինակ՝ 
        https://www.cubingusa.com/usnationals2016/schedule.php)
      equipment: Առաջնության ընթացքում օգտագործված ժամաչափերի և էկրանների քանակն
        ու տեսակը։ Խնդրում ենք հեռացրեք այն սարքավորումների անունները որոնք չեք 
        օգտագործել։
      summary: 'Թվարկած կետերը միայն ուղեցույց են ամբողջական զեկույց կազմելու համար:
        Օգտագործեք դրանք ձեր հայեցողությամբ՝ ըստ ձեր նպատակահարմարության: Խնդրում
        ենք հեռացնել չօգտագործված մասերը:'
      venue: 'Թվարկած կետերը միայն ուղեցույց են ամբողջական զեկույց կազմելու համար:
        Օգտագործեք դրանք ձեր հայեցողությամբ՝ ըստ ձեր նպատակահարմարության: Խնդրում
        ենք հեռացնել չօգտագործված մասերը:'
      organization: 'Թվարկած կետերը միայն ուղեցույց են ամբողջական զեկույց կազմելու
        համար: Օգտագործեք դրանք ձեր հայեցողությամբ՝ ըստ ձեր նպատակահարմարության: Խնդրում
        ենք հեռացնել չօգտագործված մասերը:'
      incidents: 'Խնդրում ենք տեղեկացնել բոլոր ոչ ստանդարդ միջադեպերի մասին: Համարակալեք
        միջադեպերը՝ սկսած 1-ից, որպեսզի մյուս պատվիրակները կարողանան մեկնաբանել դրանք՝
        հղում անելով համարներին: Նույնիսկ եթե լւորջ միջադեպեր չեն եղել, թվարկեք հիշվողները:
        Խնդրում ենք նշել համապատասխան վանդակները, եթե ցանկանում եք ստանալ հետադարձ
        կապ։'
      setup_images: Դուք ՊԱՐՏԱՎՈՐ եք ներառել առնվազն %{image_count} նկար այս 
        առաջնության խառնելու և հավաքելու հատվածներից, նախընտրելի է նաև 
        առաջնության ընթացքում։ Կարող եք մի անգամից ընտրել մի քանի ֆայլ։ Կարող եք
        նկարներ հեռացնել միայն բավարար քանակությամբ նկարների առկայության դեպքում
        (եթե ուզում եք նկար հեռացնել, նորը ավելացրեք, հետո հինը հանեք)։ Եթե այս 
        առաջնության հավաքելու և/կամ խառնելու հատվածից նկարներ չունեք, բացատրեք 
        ինչու։
      wrc_incidents: Այն միջադեպերի համարները, որոնց համար ուզում եք հետադարձ 
        կապ WRC-ից։
      wic_incidents_html: Այն միջադեպերի համարները, որոնց համար ուզում եք 
        հետադարձ կապ WIC-ից։ <br> <strong>%{wic_incident_alert}</strong>
      wic_incident_alert: Եթե WIC միջադեպը զգայուն թեմա է (ներառյալ 
        հանցագործություններ, բռնություն, ոտնձգություն և ոչ միայն), խնդրում ենք 
        հեռացնել այդ միջադեպերը զեկույցից և WIC-ին առանձին էլ․նամակ գրեք դրանց 
        մասին։ Այլ WIC միջադեպերի համար գրեք հակիրճ տարբերակը առանց անուններ 
        հրապարակելու, և WIC-ին հետո առանձին գրեք միջադեպի մասին թարմացումների 
        համար։ WIC-ն ընդհանուր տեղեկացվածության համար կտրամադրի անանուն հետադարձ
        կապ։ WCA կամավորի ներգրավվածությամբ միջադեպերն ամբողջությամբ հեռացրեք 
        զեկույցից և առանձին գրեք WIC-ին։
      remarks: Կիսվեք ցանկացած այլ դետալով (օրինակ համայնքի զարգացման կամ 
        հետընթացի մասին, տարածաշրջանի ապագա պլաների մասին)։ Եթե ուզում եք կիսվել
        ձեր կարծիքով կամ տեղեկատվությամբ որը չի ասվել նախորդ բաժիններում, ազատ 
        գրեք այստեղ։
