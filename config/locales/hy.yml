    user:
      dob: Մասնակցի ծննդյան օրը գրեք հետևյալ ֆորմատով ՏԱՐԻ-ԱՄ-ՕՐ։
      name: Ճիշտ լրացրեք մասնակցի անուն ազգանունը, օրինակ՝ <strong>Պողոս 
