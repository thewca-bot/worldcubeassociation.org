      անհրաժեշտ են լրացուցիչ տեղեկություններ՝ գրառումների պահպանման նպատակով։ 
      Խնդրում ենք նկատի ունենալ, որ ձեր ծննդյան ամսաթիվը երբեք չի հրապարակվի 
      առանց ձեր թույլտվության։<br/><br/>Եթե դուք գրանցվում եք ուրիշի անունից, 
      խնդրում ենք տրամադրել <strong>մասնակցի</strong> տվյալները։
