  hints:
    incident:
      title: Kumbuka kwamba hii ni ya umma, na kwamba inakupasa ujaze hii kwa 
        Kiingereza!
      private_description: Maelezo ya tukio ambayo yanaweza kutazamwa tu na 
        Wajumbe. Tafadhali jaza haya kwa Kiingereza.
      private_wrc_decision: Uamuzi wa mwisho wa WRC, pamoja na maelezo ya siri. 
        Tafadhali jaza haya kwa Kiingereza.
      public_summary: Maelezo ya jumla ya tukio na uamuzi wake, yatakayoonyeshwa
        kwa umma. Tafadhali jaza haya kwa Kiingereza.
    user:
      dob: Weka tarehe ya kuzaliwa ya mshindani katika muundo wa YYYY-MM-DD.
      name: Weka jina kamili la mshindani kwa usahihi, kwa mfano <strong>Stefan 
        Pochmann<strong>. Sio ovyoovyo kama <strong>s 
        pochman<strong>.<br/>Majina ya kati (ikiwa ni kamili au herufi za 
        kwanza) ni ya hiari.
      pending_avatar: Baada ya kupakia picha mpya ya wasifu (avatar), italazimu 
        usubiri Timu ya Matokeo ya WCA iidhinishe.
      registration_notifications_enabled: Hii inatumika tu kwa mashindani 
        unayoandaa au kuyaongoza kama mjumbe, na inaweza kubatilishwa kwa kila 
        mashindano binafsi.
      receive_developer_mails: Hii ni maalum kwa ajili ya arifa za mabadiliko 
        makubwa ya toleo kwenye rasilimali kama vile usafirishaji wa data, 
        mpangilio (schema) wa WCIF, na API za umma. Inapendekezwa kwa 
        watengenezaji wa programu wanaotegemea zana hizi.
      receive_delegate_reports: 'Ikiwa wewe ni Mjumbe Mwandamizi (Senior Delegate)
        au Mwanachama wa WRC au WQAC, utapokea Ripoti za Wajumbe kwa chaguo-msingi.
        Kumbuka: mabadiliko yanaweza kuchukua hadi saa 12 kuanza kufanya kazi.'
      delegate_reports_region: 'Ikiwa unataka kupokea ripoti zote, acha sehemu hii
        wazi (chaguo la kushuka lililo juu kabisa). Kumbuka: mabadiliko yanaweza kuchukua
        hadi saa 12 kuanza kufanya kazi.'
      otp_attempt: Angalia programu yako ya simu iliyowekwa kwa nenosiri la mara
        moja, au weka mojawapo ya nambari zako za kupona.
    dob_contact:
      dob: siku yako sahihi ya kuzaliwa kwa mtindo YY-MM-DD
      document: Ili kututhibitishia utambulisho wako na tarehe yako sahihi ya 
        kuzaliwa, unapaswa kuambatisha picha ya hati yoyote rasmi ya kisheria 
        (kitambulisho cha taifa, leseni ya udereva, kitambulisho cha mwanafunzi,
        pasipoti, cheti cha kuzaliwa, ...) ambapo jina lako na tarehe yako ya 
        kuzaliwa vinaonekana na vinaeleweka kwa mtu anayezungumza Kiingereza (au
        wasiliana na Mwakilishi wako wa WCA wa eneo lako ikiwa huna hati kama 
        hiyo). Kwenye kitambulisho hicho tunahitaji angalau jina lako na tarehe 
        ya kuzaliwa; jisikie huru kuficha/kufifisha data zozote nyingine za 
        kibinafsi kwenye kitambulisho hicho.
    post:
      body: Tumia lebo ya &lt;!-- break --&gt; kuonyesha hakikisho kwenye 
        ukurasa wa nyumbani. Chapisho lolote kwenye ukurasa wa nyumbani 
        litaonyesha maandishi yote kabla ya kigawanyaji hiki. Chapisho halisi 
        litaonyesha maudhui kamili.
      show_on_homepage: Tahadhari! Hii si salama kwa data za siri. Hii ni kwa 
        ajili tu ya kuzuia kurasa za nyumbani kuwa na msongamano. Machapisho 
        ambayo hayaonyeshwa kwenye ukurasa wa nyumbani bado yanapatikana kwa 
        umma kupitia kiungo cha kudumu au kupitia lebo.
    delegate_report:
      schedule_url: Kiunga kamili cha ratiba iliyochapishwa(e.g., 
        https://www.cubingusa.com/usnationals2016/schedule.php)
      equipment: Nambari na aina ya vipima muda na maonyesho yaliyotumika kwenye
        mashindano. Tafadhali ondoa mstari/mistari ya vifaa ambavyo huvikutumia.
      summary: Vidokezo vilivyoorodheshwa hapo juu ni kwa ajili ya mwongozo tu 
        wa ripoti kamili. Vitumie kwa hiari yako kulingana na unavyoona vinafaa.
        Tafadhali ondoa sehemu ambazo hazikutumika!
      venue: Vidokezo vilivyoorodheshwa hapo juu ni kwa ajili ya mwongozo tu wa 
        ripoti kamili. Vitumie kwa hiari yako kulingana na unavyoona vinafaa. 
        Tafadhali ondoa sehemu ambazo hazikutumika!
      organization: Vidokezo vilivyoorodheshwa hapo juu ni kwa ajili ya mwongozo
        tu wa ripoti kamili. Vitumie kwa hiari yako kulingana na unavyoona 
        vinafaa. Tafadhali ondoa sehemu ambazo hazikutumika!
      incidents: Tafadhali ripoti matukio yote ambayo si ya kawaida. Nambaza 
        matukio hayo kuanzia 1., ili Wacha wengine waweze kutoa maoni kwa 
        kuyarejelea kwa nambari zao. Hata kama kila kitu kilionekana cha 
        kawaida, tafadhali orodhesha angalau kesi zinazostahili kuzingatiwa 
        zaidi. Tafadhali weka alama kwenye visanduku vinavyofaa hapa chini ikiwa
        unatafuta maoni kikamilifu.
      setup_images: Lazima uweke angalau picha %{image_count} zinazoonyesha 
        maeneo ya kuchanganya na ya mashindano kutoka kwa mashindano haya ya 
        sasa, ikiwezekana wakati wa mashindano (picha nyingine pia 
        zinakaribishwa). Unaweza kuchagua faili nyingi kwa wakati mmoja. Unaweza
        kufuta picha tu wakati picha zingine za kutosha zimewekwa (ikiwa unataka
        kubadilisha picha, unahitaji kupakia mpya kwanza, kisha ufute ya 
        zamani). Ikiwa huna picha za sasa za eneo la mashindano na/au eneo la 
        kuchanganya wakati linatumika, tafadhali eleza kwanini.
      wrc_incidents: Orodha ya nambari zinazorejelea matukio yoyote ambayo 
        ungependa kupokea maoni kutoka kwa WRC.
      wic_incidents_html: Orodha ya nambari zinazorejelea matukio yoyote ambayo 
        ungependa kupokea maoni kutoka kwa WIC. <br> 
        <strong>%{wic_incident_alert}</strong>
      wic_incident_alert: Kama tukio la WIC ni nyeti (pamoja na lakini sio tu 
        uhalifu, unyanyasaji, shambulio, n.k.), tafadhali ondoa hili kwenye 
        ripoti yako na utume barua pepe kwa WIC kando. Kwa matukio mengine ya 
        WIC, tumia toleo fupi, lisilojulikana jina la mtu (anonymized) la tukio 
        hilo na ufuatilie na WIC kwa faragha kwa maelezo zaidi. WIC bado itatoa 
        maoni kwenye matoleo yasiyojulikana jina kwa ajili ya uelewa wa jumla. 
        Kwa matukio yote ya WIC yanayohusisha Kujitolea kwa WCA Volunteer, 
        tafadhali ondoa maelezo yote kutoka kwenye ripoti, na uwasiliane na WIC 
        kwa faragha.
      remarks: Zungumzia jambo lingine lolote ambalo ungependa kushiriki (k.m., 
        maendeleo/kudorora ndani ya jamii, mipango ya siku za usoni kwa ajili ya
        eneo hili). Ikiwa kwa ajili ya ufupi uliacha jambo fulani bila kutajwa 
        katika sehemu zilizopita, jisikie huru kutoa maoni yako hapa.
    competition_tab:
      name: 'Mifano: Usafiri, Malipo, Tuzo, Malazi'
    regional_organization:
      website: Lazima iwe url halali ya http(s). HTTPS inashauriwa
      logo: Lazima iwe katika mfumo wa PNG, yenye ubora mzuri, na yenye asili ya
